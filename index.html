<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#9ED8F5">
<title>Kalambury dla Dzieci</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: one screen — sky background, a deck of big picture cards in the middle, two round help buttons below. */
:root {
  --sky: #9ED8F5;
  --sky-deep: #6FC1EA;
  --paper: #FFFFFF;
  --ink: #1E2A4A;
  --sun: #FFC93C;
  --yes: #22B36B;
  --no: #EF4B4B;
  --maybe: #8C97B2;
  --t-zwierze: #D3F3CB;
  --t-czynnosc: #FFF0B3;
  --t-pojazd: #D3E4FF;
  --t-rzecz: #FFD9E6;
  --t-jedzenie: #FFE0C2;
  --t-uczucie: #E7DAFF;
  --font: "Baloo 2", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--sky);
  color: var(--ink);
  font-family: var(--font);
  overflow: hidden;
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
}
.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 12px;
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 520px;
  margin: 0 auto;
}
header { display: flex; align-items: center; justify-content: center; min-height: 40px; }
.logo { font-weight: 800; font-size: 1.6rem; letter-spacing: .02em; line-height: 1; }
.logo span { display: inline-block; }
.logo span:nth-child(odd) { transform: rotate(-4deg); }
.logo span:nth-child(even) { transform: rotate(3deg) translateY(2px); }

.listen-bar {
  display: flex; align-items: center; gap: 8px;
  background: var(--paper); border-radius: 999px; padding: 4px 14px 4px 8px;
  font-weight: 800; font-size: 1.05rem;
}
.listen-bar .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--no); animation: pulse 1s infinite; }

.stage { position: relative; display: grid; place-items: center; min-height: 0; }
.deck { position: relative; width: 100%; height: 100%; max-height: 600px; }
.deck::before, .deck::after {
  content: ""; position: absolute; inset: 10px 6px -6px; border-radius: 34px;
  background: var(--sky-deep); transform: rotate(2.5deg);
}
.deck::after { inset: 4px 2px -2px; background: #86CDEF; transform: rotate(-1.8deg); }

.card {
  position: absolute; inset: 0; z-index: 2;
  background: var(--paper);
  border-radius: 34px;
  border: 5px solid var(--ink);
  box-shadow: 0 8px 0 var(--ink);
  display: grid; grid-template-rows: 1fr auto; align-items: stretch; justify-items: stretch;
  padding: 18px 16px 22px;
  touch-action: none;
  cursor: grab;
  overflow: hidden;
}
.card.fly { transition: transform .28s ease-in, opacity .28s ease-in; }
.card.snap { transition: transform .22s cubic-bezier(.3,1.6,.5,1); }
.card .art {
  position: relative; min-height: 0;
  display: grid; place-items: center;
  border-radius: 24px; overflow: hidden;
  background: var(--tint, var(--t-zwierze));
}
.card .emoji { font-size: min(42vw, 30vh, 200px); line-height: 1; filter: drop-shadow(0 6px 0 rgba(30,42,74,.12)); }
.card .pic { width: min(64vw, 40vh, 300px); aspect-ratio: 1; max-width: 100%; }
.card .pic svg, .card .badge svg { display: block; width: 100%; height: 100%; }
.card .badge svg { width: 52px; height: 52px; }
.card .art canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.card .badge {
  position: absolute; left: 10px; top: 8px; z-index: 1; font-size: 2.4rem; line-height: 1;
  filter: drop-shadow(0 3px 0 rgba(30,42,74,.12));
}
.card .loading { font-weight: 800; font-size: 1.2rem; }
.card .word {
  margin-top: 14px; font-weight: 800; font-size: clamp(1.6rem, 7.5vw, 2.5rem);
  line-height: 1.05; text-align: center; text-wrap: balance; letter-spacing: .02em;
}
.nav {
  position: absolute; top: 50%; z-index: 3; transform: translateY(-50%);
  width: 46px; height: 46px; border-radius: 50%;
  border: 4px solid var(--ink); background: var(--sun); color: var(--ink);
  font: 800 1.5rem/1 var(--font); display: grid; place-items: center; cursor: pointer;
}
.nav.prev { left: -10px; }
.nav.next { right: -10px; }

.controls { display: flex; justify-content: center; gap: 28px; }
.btn {
  width: 92px; height: 92px; border-radius: 50%;
  border: 5px solid var(--ink); box-shadow: 0 6px 0 var(--ink);
  display: grid; place-items: center; cursor: pointer;
  background: var(--paper); color: var(--ink); padding: 0;
}
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.btn svg { width: 54px; height: 54px; }
.btn.hint { background: var(--sun); }
.btn.on { background: var(--ink); color: var(--paper); }
.btn.mic.on { background: var(--no); color: var(--paper); animation: ring 1.4s infinite; }
.btn:focus-visible, .nav:focus-visible { outline: 4px solid var(--paper); outline-offset: 3px; }

/* Answer overlay for the listening mode */
.answer {
  position: fixed; inset: 0; z-index: 10;
  display: grid; place-items: center; align-content: center; gap: 18px;
  background: var(--bg, var(--yes)); color: var(--paper);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  text-align: center;
}
.answer .sign {
  width: min(62vw, 300px); height: min(62vw, 300px); border-radius: 50%;
  background: var(--paper); color: var(--bg); display: grid; place-items: center;
  animation: pop .35s cubic-bezier(.3,1.7,.5,1);
}
.answer .sign svg { width: 62%; height: 62%; }
.answer .big { font-weight: 800; font-size: clamp(3rem, 16vw, 5rem); line-height: 1; }
.answer .heard { font-size: 1.1rem; opacity: .9; max-width: 32ch; min-height: 1.4em; font-weight: 600; }
.answer.yes { --bg: var(--yes); }
.answer.no { --bg: var(--no); }
.answer.maybe { --bg: var(--maybe); }
.answer.win { --bg: var(--sun); color: var(--ink); }
.answer.win .sign { background: var(--paper); font-size: min(30vw, 150px); }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 11; }

.toast {
  position: fixed; left: 50%; bottom: calc(130px + env(safe-area-inset-bottom, 0px)); z-index: 12;
  transform: translateX(-50%); width: min(92vw, 420px);
  background: var(--ink); color: var(--paper); border-radius: 18px; padding: 12px 16px;
  font-weight: 600; font-size: 1rem; text-align: center;
}

@keyframes pulse { 50% { opacity: .25; } }
@keyframes ring { 0%,100% { box-shadow: 0 6px 0 var(--ink), 0 0 0 0 rgba(239,75,75,.55); } 60% { box-shadow: 0 6px 0 var(--ink), 0 0 0 18px rgba(239,75,75,0); } }
@keyframes pop { from { transform: scale(.4); } to { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) {
  .listen-bar .dot, .btn.mic.on, .answer .sign { animation: none; }
}
@media (max-height: 620px) {
  .btn { width: 76px; height: 76px; }
  .btn svg { width: 44px; height: 44px; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" id="logo" aria-label="Kalambury"><span>K</span><span>a</span><span>l</span><span>a</span><span>m</span><span>b</span><span>u</span><span>r</span><span>y</span></div>
    <div class="listen-bar" id="listenBar" hidden><span class="dot"></span>Słucham pytań…</div>
  </header>

  <main class="stage">
    <div class="deck" id="deck">
      <div class="card" id="card">
        <div class="art" id="art"></div>
        <div class="word" id="word"></div>
      </div>
    </div>
    <button class="nav prev" id="prev" aria-label="Poprzednia karta">‹</button>
    <button class="nav next" id="next" aria-label="Następna karta">›</button>
  </main>

  <nav class="controls">
    <button class="btn hint" id="hintBtn" aria-label="Pokaż ludzika z podpowiedzią" aria-pressed="false">
      <svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="30" cy="12" r="7"/><path d="M30 19v19M30 25l-13-9M30 25l13-9M30 38l-9 15M30 38l9 15"/></svg>
    </button>
    <button class="btn mic" id="micBtn" aria-label="Słuchaj pytań" aria-pressed="false">
      <svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="21" y="6" width="18" height="30" rx="9"/><path d="M13 29a17 17 0 0 0 34 0M30 46v8M21 54h18"/></svg>
    </button>
  </nav>
</div>

<div class="answer" id="answer" hidden>
  <div class="sign" id="answerSign"></div>
  <div class="big" id="answerBig"></div>
  <div class="heard" id="answerHeard"></div>
</div>
<canvas class="confetti" id="confetti" hidden></canvas>
<div class="toast" id="toast" hidden></div>

/* ---------- Cards ----------
   word, emoji, tint (category colour), names = words that count as guessing it,
   f = features that are true for it, cam = camera angle around the 3D figure,
   pose(s) = body position s seconds into the hint loop (see the figure section below). */
let THREE = null;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const TAU = Math.PI * 2;
const sw = (s, p, o = 0) => Math.sin(s * TAU / p + o);
const cw = (s, p, o = 0) => Math.cos(s * TAU / p + o);
const up = v => Math.max(0, v);
const both = (x, y, z) => ({ L: V(x, y, z), R: V(-x, y, z) });
const elbowsDown = () => ({ poleL: V(1, -1, -.3), poleR: V(-1, -1, -.3) });
const elbowsOut = () => ({ poleL: V(1, 0, -.2), poleR: V(-1, 0, -.2) });
const kneesOut = () => ({ kneeL: V(1, 0, 1), kneeR: V(-1, 0, 1) });
const march = (s, p, h = .12, f = .06) => {
  const a = sw(s, p);
  return { LF: V(.11, .04 + h * up(a), .02 + f * up(a)), RF: V(-.11, .04 + h * up(-a), .02 + f * up(-a)) };
};
const hop = (s, p, h, y0 = .88) => {
  const y = y0 + h * up(sw(s, p)), fy = .04 + Math.max(0, y - .95);
  return { y, LF: V(.11, fy, .02), RF: V(-.11, fy, .02) };
};

const face = (cx, cy, r) =>
  `<circle cx="${cx - r * .33}" cy="${cy}" r="${r * .1}" fill="${INK}"/><circle cx="${cx + r * .33}" cy="${cy}" r="${r * .1}" fill="${INK}"/>` +

const shoulders = `<rect x="88" y="122" width="24" height="30" fill="${SKIN}" stroke="${INK}" stroke-width="3"/>` +

/* ---------- Matching a spoken question ---------- */
const norm = s => s.toLowerCase().replace(/ł/g, 'l').normalize('NFD').replace(/[̀-ͯ]/g, '');
const words = s => norm(s).split(/[^a-z]+/).filter(Boolean);
const hitOne = (tokens, st) => st[0] === '=' ? tokens.includes(st.slice(1)) : tokens.some(t => t.startsWith(st));
// A stem with spaces ("mycie zeb") needs every part to appear in the question.
const hit = (tokens, stems) => stems.some(st => st.split(' ').every(part => hitOne(tokens, part)));

// 'win' = guessed this card, 'yes' / 'no' = answer about a feature or another card, 'maybe' = not understood
function judge(text, card) {
  const tokens = words(text);
  if (hit(tokens, card.names)) return 'win';
  const asked = Object.keys(FEATURES).filter(k => hit(tokens, FEATURES[k]));
  if (asked.length) return asked.every(k => card.f.includes(k)) ? 'yes' : 'no';
  if (CARDS.some(c => c !== card && hit(tokens, c.names))) return 'no';
  return 'maybe';
}

/* ---------- 3D figure ----------
   Three.js is loaded the first time a hint is opened, so the cards work without it.
   Poses: hands L/R in torso space (shoulders at x ±0.2, y 0.48; mouth ≈ (0, 0.66, 0.13); chest front ≈ z 0.2),
   feet LF/RF in ground space (ankle on the floor at y 0.04), y = hip height, lean/twist/side = torso,
   nod/look/tilt = head (degrees), poleL/poleR = which way elbows point, kneeL/kneeR = which way knees point.
   The figure faces +z; its left (L) is +x. */
let fig = null;

async function loadFigure() {
  if (fig) return fig;
  THREE = await import('three');
  const rad = THREE.MathUtils.degToRad;
  const DEF = {
    y: .95, lean: 0, twist: 0, side: 0, nod: 0, look: 0, tilt: 0,
    L: V(.27, -.06, .03), R: V(-.27, -.06, .03), LF: V(.11, .04, .02), RF: V(-.11, .04, .02),
    poleL: V(1, -.3, -.8), poleR: V(-1, -.3, -.8), kneeL: V(.15, 0, 1), kneeR: V(-.15, 0, 1),
  };

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(34, 1, .1, 50);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xd8c8b0, 2.2));
  const sun = new THREE.DirectionalLight(0xffffff, 2.4);
  sun.position.set(2, 4, 3);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -1.5, right: 1.5, top: 2.5, bottom: -.5 });
  scene.add(sun);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(1.4, 48), new THREE.ShadowMaterial({ opacity: .22 }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: .55 });
  const M = { skin: mat('#F3C7A1'), shirt: mat('#FF8A3D'), pants: mat('#3E6FD9'), shoe: mat('#1E2A4A'), hair: mat('#5B3A24'), dark: mat('#1E2A4A') };
  const mesh = (geo, m, parent, pos) => {
    const x = new THREE.Mesh(geo, m);
    x.castShadow = true;
    if (pos) x.position.copy(pos);
    parent.add(x);
    return x;
  };
  const joint = (parent, pos) => {
    const g = new THREE.Group();
    g.position.copy(pos);
    parent.add(g);
    return g;
  };
  const limb = (g, len, r, m) => mesh(new THREE.CapsuleGeometry(r, len, 6, 14), m, g, V(0, -len / 2, 0));

  const pelvis = joint(scene, V(0, .95, 0));
  mesh(new THREE.SphereGeometry(.15, 20, 14), M.pants, pelvis).scale.set(1.15, .8, .8);
  const torso = joint(pelvis, V(0, .02, 0));
  mesh(new THREE.CapsuleGeometry(.14, .3, 8, 16), M.shirt, torso, V(0, .28, 0)).scale.set(1.2, 1, .8);
  const neck = joint(torso, V(0, .55, 0));
  mesh(new THREE.CylinderGeometry(.045, .05, .08, 10), M.skin, neck, V(0, .02, 0));
  mesh(new THREE.SphereGeometry(.14, 28, 20), M.skin, neck, V(0, .16, 0));
  mesh(new THREE.SphereGeometry(.148, 28, 14, 0, TAU, 0, Math.PI * .55), M.hair, neck, V(0, .165, -.01)).rotation.x = -.35;
  const eyes = [.05, -.05].map(x => mesh(new THREE.SphereGeometry(.02, 10, 8), M.dark, neck, V(x, .18, .128)));
  const smile = mesh(new THREE.TorusGeometry(.045, .012, 8, 20, Math.PI), M.dark, neck, V(0, .115, .13));
  const openMouth = mesh(new THREE.SphereGeometry(.03, 14, 10), M.dark, neck, V(0, .105, .125));
  openMouth.scale.set(1.2, .9, .5);

  const ARM = [.3, .29], LEG = [.43, .45];
  const arms = {}, legs = {};
  for (const [k, side] of [['L', 1], ['R', -1]]) {
    const upper = joint(torso, V(.2 * side, .48, 0));
    mesh(new THREE.SphereGeometry(.068, 14, 10), M.shirt, upper);
    limb(upper, .28, .058, M.shirt);
    const lower = joint(upper, V(0, -ARM[0], 0));
    limb(lower, .26, .048, M.skin);
    mesh(new THREE.SphereGeometry(.064, 14, 10), M.skin, joint(lower, V(0, -ARM[1], 0)));
    arms[k] = [upper, lower];

    const hip = joint(pelvis, V(.1 * side, -.04, 0));
    limb(hip, .4, .072, M.pants);
    const knee = joint(hip, V(0, -LEG[0], 0));
    limb(knee, .42, .064, M.pants);
    const foot = joint(knee, V(0, -LEG[1], 0));
    mesh(new THREE.BoxGeometry(.12, .07, .24), M.shoe, foot, V(0, 0, .05));
    legs[k] = [hip, knee, foot];
  }

  // Two-bone IK: aim the upper bone so the lower bone's end reaches T, bending toward `pole`.
  const DOWN = V(0, -1, 0);
  function reach([upper, lower], [a, b], T, pole) {
    const S = upper.position;
    const dir = T.clone().sub(S);
    const d = THREE.MathUtils.clamp(dir.length(), .02, a + b - .001);
    dir.normalize();
    const cosA = THREE.MathUtils.clamp((a * a + d * d - b * b) / (2 * a * d), -1, 1);
    const p = pole.clone().sub(dir.clone().multiplyScalar(pole.dot(dir)));
    if (p.lengthSq() < 1e-6) p.set(0, 0, 1);
    p.normalize();
    const E = S.clone().addScaledVector(dir, a * cosA).addScaledVector(p, a * Math.sqrt(1 - cosA * cosA));
    upper.quaternion.setFromUnitVectors(DOWN, E.clone().sub(S).normalize());
    const end = S.clone().addScaledVector(dir, d);
    lower.quaternion.setFromUnitVectors(DOWN, end.sub(E).normalize().applyQuaternion(upper.quaternion.clone().invert()));
  }

  function setCard(card) {
    smile.visible = card.mouth !== 'open';
    smile.rotation.z = card.mouth === 'sad' ? 0 : Math.PI;
    smile.position.y = card.mouth === 'sad' ? .085 : .115;
    openMouth.visible = card.mouth === 'open';
    eyes.forEach(e => e.scale.set(1, card.eyes === 'closed' ? .25 : 1, 1));
  }

  function render(card, s, now, el) {
    const p = { ...DEF, ...card.pose(s) };
    pelvis.position.y = p.y;
    torso.rotation.set(rad(p.lean), rad(p.twist), rad(p.side));
    neck.rotation.set(rad(p.nod), rad(p.look), rad(p.tilt));
    reach(arms.L, ARM, p.L, p.poleL);
    reach(arms.R, ARM, p.R, p.poleR);
    for (const [k, T, pole] of [['L', p.LF, p.kneeL], ['R', p.RF, p.kneeR]]) {
      const [hip, knee, foot] = legs[k];
      reach([hip, knee], LEG, T.clone().sub(pelvis.position), pole);
      foot.quaternion.copy(hip.quaternion).multiply(knee.quaternion).invert();   // keep the shoe flat
    }
    const w = el.clientWidth, h = el.clientHeight;
    if (w && h) {
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    const az = rad(card.cam + 10 * Math.sin(now / 1000 * TAU / 9)), elev = rad(12), dist = 4.6;
    camera.position.set(dist * Math.sin(az) * Math.cos(elev), .95 + dist * Math.sin(elev), dist * Math.cos(az) * Math.cos(elev));
    camera.lookAt(0, .92, 0);
    renderer.render(scene, camera);
  }

  fig = { canvas: renderer.domElement, setCard, render };
  return fig;
}

/* ---------- Deck ---------- */
const $ = id => document.getElementById(id);
const cardEl = $('card'), artEl = $('art'), wordEl = $('word');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let order = shuffle(CARDS.map((_, i) => i)), pos = 0;
let hintOn = false, raf = 0, t0 = 0, showToken = 0;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const current = () => CARDS[order[pos]];

async function showCard(offset = 0) {
  const c = current(), token = ++showToken;
  artEl.style.setProperty('--tint', `var(--t-${c.tint})`);
  wordEl.textContent = c.word;
  cancelAnimationFrame(raf);
  artEl.textContent = '';
  if (!hintOn) {
    const e = document.createElement('div');
    e.className = c.art ? 'pic' : 'emoji';
    if (c.art) e.innerHTML = c.art; else e.textContent = c.emoji;
    artEl.appendChild(e);
    return;
  }
  const loading = document.createElement('div');
  loading.className = 'loading';
  loading.textContent = 'Ładuję ludzika…';
  artEl.appendChild(loading);
  let f;
  try { f = await loadFigure(); } catch (_) {
    if (token !== showToken) return;
    setHint(false);
    toast('Nie udało się wczytać ludzika. Sprawdź internet i spróbuj jeszcze raz.');
    return;
  }
  if (token !== showToken) return;
  artEl.textContent = '';
  const badge = document.createElement('div');
  badge.className = 'badge';
  if (c.art) badge.innerHTML = c.art; else badge.textContent = c.emoji;
  artEl.append(badge, f.canvas);
  f.setCard(c);
  t0 = performance.now() - offset * 1000;
  const loop = now => {
    f.render(c, reduceMotion ? 0 : (now - t0) / 1000, reduceMotion ? 0 : now, artEl);
    if (!reduceMotion) raf = requestAnimationFrame(loop);
  };
  loop(performance.now());
}

function go(dir) {
  cardEl.classList.remove('snap');
  cardEl.classList.add('fly');
  cardEl.style.transform = `translateX(${dir * 120}%) rotate(${dir * 18}deg)`;
  cardEl.style.opacity = '0';
  setTimeout(() => {
    pos = (pos + dir + order.length) % order.length;
    if (pos === 0 && dir > 0) order = shuffle(order);
    setHint(false);
    cardEl.classList.remove('fly');
    cardEl.style.transform = `translateX(${-dir * 40}%) scale(.9)`;
    void cardEl.offsetWidth;
    cardEl.classList.add('snap');
    cardEl.style.transform = '';
    cardEl.style.opacity = '';
  }, reduceMotion ? 0 : 260);
}

function setHint(on) {
  hintOn = on;
  $('hintBtn').classList.toggle('on', on);
  $('hintBtn').setAttribute('aria-pressed', on);
  showCard();
}

// Swipe
let startX = null, dx = 0;
cardEl.addEventListener('pointerdown', e => {
  startX = e.clientX; dx = 0;
  cardEl.classList.remove('snap', 'fly');
  cardEl.setPointerCapture(e.pointerId);
});
cardEl.addEventListener('pointermove', e => {
  if (startX === null) return;
  dx = e.clientX - startX;
  cardEl.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
});
const endDrag = () => {
  if (startX === null) return;
  startX = null;
  if (Math.abs(dx) > 80) { go(dx < 0 ? 1 : -1); return; }
  cardEl.classList.add('snap');
  cardEl.style.transform = '';
};
cardEl.addEventListener('pointerup', endDrag);
cardEl.addEventListener('pointercancel', endDrag);
$('next').addEventListener('click', () => go(1));
$('prev').addEventListener('click', () => go(-1));
$('hintBtn').addEventListener('click', () => setHint(!hintOn));

/* ---------- Answers ---------- */
const ICONS = {
  yes: '<svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 31l12 12 24-26"/></svg>',
  no: '<svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"><path d="M16 16l28 28M44 16L16 44"/></svg>',
  maybe: '<svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 21a9 9 0 1 1 13 8c-3 2-4 4-4 8"/><circle cx="30" cy="48" r="2" fill="currentColor"/></svg>',
};
const LABEL = { yes: 'TAK', no: 'NIE', maybe: 'POWTÓRZ', win: 'BRAWO!' };
let answerTimer = 0;

function showAnswer(kind, heard) {
  const box = $('answer');
  box.className = 'answer ' + kind;
  $('answerSign').innerHTML = kind === 'win' ? '🎉' : ICONS[kind];
  $('answerBig').textContent = LABEL[kind];
  $('answerHeard').textContent = heard ? '„' + heard + '”' : '';
  box.hidden = false;
  clearTimeout(answerTimer);
  if (kind === 'win') { confetti(); return; }   // stays until tapped, then next card
  answerTimer = setTimeout(hideAnswer, 3200);
}
function hideAnswer() {
  const box = $('answer');
  if (box.hidden) return;
  const won = box.classList.contains('win');
  box.hidden = true;
  $('confetti').hidden = true;
  if (won) go(1);
}
$('answer').addEventListener('click', hideAnswer);

function confetti() {
  if (reduceMotion) return;
  const cv = $('confetti'), ctx = cv.getContext('2d');
  cv.hidden = false;
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ['#22B36B', '#EF4B4B', '#FFFFFF', '#6FC1EA', '#1E2A4A'];
  const bits = Array.from({ length: 120 }, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .5,
    vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 3, r: Math.random() * 6.28,
    c: colors[Math.floor(Math.random() * colors.length)], s: 6 + Math.random() * 7,
  }));
  const start = performance.now();
  (function tick(now) {
    if (cv.hidden) return;
    ctx.clearRect(0, 0, cv.width, cv.height);
    bits.forEach(b => {
      b.x += b.vx; b.y += b.vy; b.r += .1;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r);
      ctx.fillStyle = b.c; ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2);
      ctx.restore();
    });
    if (now - start < 4000) requestAnimationFrame(tick);
  })(start);
}

let toastTimer = 0;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.hidden = true, 4500);
}

/* ---------- Listening mode ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;

function setListening(on) {
  listening = on;
  $('micBtn').classList.toggle('on', on);
  $('micBtn').setAttribute('aria-pressed', on);
  $('listenBar').hidden = !on;
  $('logo').hidden = on;
}

function heardSomething(alternatives) {
  const c = current();
  let best = null;
  for (const text of alternatives) {
    const kind = judge(text, c);
    if (kind !== 'maybe') { best = { kind, text }; break; }
  }
  if (!best) best = { kind: 'maybe', text: alternatives[0] };
  showAnswer(best.kind, best.text.trim());
}

$('micBtn').addEventListener('click', () => {
  if (listening) { setListening(false); try { rec && rec.stop(); } catch (_) {} return; }
  if (!SR) { toast('Ta przeglądarka nie umie słuchać. Otwórz grę w Chrome (Android) lub Safari (iPhone).'); return; }
  rec = new SR();
  rec.lang = 'pl-PL';
  rec.continuous = true;
  rec.interimResults = false;
  rec.maxAlternatives = 3;
  rec.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (!e.results[i].isFinal) continue;
      heardSomething(Array.from(e.results[i]).map(a => a.transcript));
    }
  };
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      setListening(false);
      toast('Brak dostępu do mikrofonu. Zezwól na mikrofon w ustawieniach przeglądarki.');
    }
  };
  rec.onend = () => { if (listening) setTimeout(() => { try { rec.start(); } catch (_) {} }, 250); };
  try { rec.start(); setListening(true); } catch (_) { toast('Nie udało się włączyć mikrofonu.'); }
});

// For checking without a microphone, in the browser console:
//   ask('czy to zwierzę?')  — answers about the current card
//   peek(index, seconds)    — opens card CARDS[index] with its hint, `seconds` into the animation
window.ask = q => { heardSomething([q]); return judge(q, current()); };
window.peek = async (i, s = 0) => {
  pos = order.indexOf(i);
  hintOn = true;
  await showCard(s);
};
window.CARDS = CARDS;
window.judge = judge;

showCard();
</script>
